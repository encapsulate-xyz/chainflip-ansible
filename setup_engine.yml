---
- name: Set up Chainflip Engine
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [engine]
    engine: true
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run engine role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include engine role
          ansible.builtin.include_role:
            name: engine
            public: true

  post_tasks:
    - name: Verify engine
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ engine_log_file_path }}"
            version_command: "{{ engine_bin_dir }}/{{ service_identifier }} --version"
            # the log filter server on the command server port starts before the engine connects to the node, unlike prometheus
            health_url: "http://localhost:{{ chainflip.engine.ports.command_server_port }}/tracing"
